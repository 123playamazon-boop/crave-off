function faq(q,a){ return '<details><summary>'+q+'</summary><p>'+a+'</p></details>'; }
function rvw(ini,name,title,body){ return '<div class="rvw"><div class="rtop"><div class="av">'+ini+'</div><div><div class="nm">'+name+'</div><div class="stars">★★★★★</div></div></div><div class="rt">'+title+'</div><div class="rb">'+body+'</div><span class="vp">✔ Verified buyer</span><div class="src">United States</div></div>'; }

setEarn(0); render();
</script>
